<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Steam Status Monitor</title>
    <style>
        /* 确保页面背景完全透明 */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            overflow: hidden;
        }

        /* 容器用于放置卡片 */
        #container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 40px;
            box-sizing: border-box;

            /* --- 核心动画设置 --- */

            /* 1. 初始状态 (Idle/Exit)：透明 且 向上偏移 */
            opacity: 0;
            transform: translateY(-50px);

            /* 2. 动画过渡：时间和曲线 */
            /* 注意：这里的 2s 必须和 JS 里的 ANIMATION_DURATION 匹配 */
            transition: opacity 2s ease, transform 2s cubic-bezier(0.2, 0.8, 0.2, 1);

            /* 3. 硬件加速优化 */
            will-change: opacity, transform;
        }

        /* --- 状态 1: 完全显示 (Cycle On) --- */
        #container.visible {
            opacity: 1;
            transform: translateY(0); /* 在正常位置 */
        }

        /* --- 状态 2: 变淡隐藏 (Cycle Off) --- */
        /* 新增：只降低透明度，不改变位置，不完全消失 */
        #container.dimmed {
            opacity: 0.3;
            transform: translateY(0); /* 保持在正常位置，不要上浮 */
        }
    </style>
</head>

<body>
    <div id="container"></div>

    <script>
        const API_URL = "/current/%token%";
        const REFRESH_INTERVAL = 1000;
        const CYCLE_INTERVAL = 30000;
        const ANIMATION_DURATION = 2000; // 必须匹配 CSS 中的 transition 时间

        const container = document.getElementById('container');

        // 状态变量
        let isGameRunning = false;
        let isInDisplayCycle = true;
        // let lastShowState = false; // (已移除) 新逻辑不再单纯依赖布尔值切换，直接管理 Class

        // --- 会话控制变量 ---
        let currentSignature = "idle";
        let isSwitchingGame = false;
        let localBootId = null;

        // --- 核心渲染函数 (逻辑已重写) ---
        const render = () => {
            // 场景 A: 正在切游戏 或 游戏完全退出 -> 执行"退出动画" (上浮 + 全透明)
            if (isSwitchingGame || !isGameRunning) {
                // 移除 visible 和 dimmed，强制回退到 CSS 中 #container 的默认状态
                if (container.classList.contains('visible') || container.classList.contains('dimmed')) {
                    container.classList.remove('visible', 'dimmed');
                    console.log("Animation: Exit/Switch -> Slide Out");
                }
                return;
            }

            // 场景 B: 游戏运行中 -> 在"高亮"和"变淡"之间切换
            if (isInDisplayCycle) {
                // 周期：显示
                if (!container.classList.contains('visible')) {
                    container.classList.remove('dimmed'); // 移除变淡
                    container.classList.add('visible');   // 添加高亮
                    console.log("Animation: Cycle -> Full Visibility");
                }
            } else {
                // 周期：隐藏 (变淡)
                if (!container.classList.contains('dimmed')) {
                    container.classList.remove('visible'); // 移除高亮
                    container.classList.add('dimmed');     // 添加变淡
                    console.log("Animation: Cycle -> Dimmed (0.1)");
                }
            }
        };

        const toggleCycle = () => {
            // 只有在没切游戏的时候才允许周期切换
            if (isGameRunning && !isSwitchingGame) {
                isInDisplayCycle = !isInDisplayCycle;
                render();
            }
        };

        let cycleIntervalId = setInterval(toggleCycle, CYCLE_INTERVAL);

        // 数据轮询逻辑
        const updateData = async () => {
            // 如果正在转场动画中，暂停数据更新，防止内容跳变
            if (isSwitchingGame) return;

            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    const json = await response.json();
                    const { server, info, render: newHtmlContent } = json;

                    // 服务器重启检测
                    if (localBootId === null) {
                        localBootId = server.boot_id;
                        console.log(`Connected to Server Instance: ${localBootId}`);
                    } else if (localBootId !== server.boot_id) {
                        console.warn("Server Restart Detected! Reloading...");
                        window.location.reload();
                        return;
                    }

                    // --- 场景 1: 游戏开始 (从无到有) ---
                    if (!isGameRunning && info.is_running) {
                        console.log("Game Started.");
                        container.innerHTML = newHtmlContent;
                        currentSignature = info.signature;

                        isGameRunning = true;
                        isInDisplayCycle = true; // 强制显示

                        // 重置周期
                        clearInterval(cycleIntervalId);
                        cycleIntervalId = setInterval(toggleCycle, CYCLE_INTERVAL);

                        render();
                    }
                    // --- 场景 2: 切换游戏 (签名变了) ---
                    else if (isGameRunning && info.is_running && info.signature !== currentSignature) {
                        console.log(`Switching Game: ${currentSignature} -> ${info.signature}`);

                        // 1. 锁定状态，开始转场
                        isSwitchingGame = true;
                        render(); // 这会触发 Scenario A，Slide Out 动画

                        // 2. 等待动画结束
                        setTimeout(() => {
                            // 3. 替换内容
                            container.innerHTML = newHtmlContent;
                            currentSignature = info.signature;

                            // 4. 解锁并重置状态
                            isSwitchingGame = false;
                            isInDisplayCycle = true; // 新游戏开始，必须高亮显示

                            clearInterval(cycleIntervalId);
                            cycleIntervalId = setInterval(toggleCycle, CYCLE_INTERVAL);

                            // 5. 触发进入动画
                            render();
                        }, ANIMATION_DURATION);
                    }
                    // --- 场景 3: 同一个游戏，只更新时间 ---
                    else if (isGameRunning && info.is_running) {
                        if (container.innerHTML !== newHtmlContent) {
                            container.innerHTML = newHtmlContent;
                        }
                    }
                    // --- 场景 4: 游戏结束 ---
                    else if (isGameRunning && !info.is_running) {
                        console.log("Game Stopped.");
                        isGameRunning = false;
                        currentSignature = "idle";
                        render(); // 触发退出动画
                    }

                } else {
                    // 接口错误也视为游戏结束
                    isGameRunning = false;
                    render();
                }
            } catch (error) {
                console.warn("Connection lost...", error);
            }
        };

        setInterval(updateData, REFRESH_INTERVAL);
        updateData();
    </script>
</body>

</html>

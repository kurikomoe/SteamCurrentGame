<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Steam Status Monitor</title>
    <style>
        /* 确保页面背景完全透明 */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            overflow: hidden;
        }

        /* 容器用于放置卡片 */
        #container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 40px;
            box-sizing: border-box;

            /* --- 核心动画设置 --- */

            /* 1. 初始状态：透明 且 向上偏移 (隐藏在上面) */
            opacity: 0;
            transform: translateY(-50px);

            /* 2. 动画过渡：时间和曲线 */
            /* 注意：这里的 2s 必须和 JS 里的 ANIMATION_DURATION 匹配 */
            transition: opacity 2s ease, transform 2s cubic-bezier(0.2, 0.8, 0.2, 1);

            /* 3. 硬件加速优化 */
            will-change: opacity, transform;
        }

        /* --- 显示状态的 Class --- */
        #container.visible {
            opacity: 1;
            /* 回到正常位置，形成下移效果 */
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div id="container"></div>

    <script>
        const API_URL = "/current/%token%";
        const REFRESH_INTERVAL = 1000;
        const CYCLE_INTERVAL = 30000;
        const ANIMATION_DURATION = 2000; // 必须匹配 CSS 中的 transition 时间 (2s = 2000ms)

        const container = document.getElementById('container');

        // 状态变量
        let isGameRunning = false;
        let isInDisplayCycle = true;
        let lastShowState = false;

        // --- 新增：会话控制变量 ---
        let currentSignature = "idle"; // 当前游戏的签名 (AppID_StartTime)
        let isSwitchingGame = false;   // 是否正在执行切游戏动画
        let localBootId = null;        // 服务器实例 ID (用于检测重启)

        // 核心渲染函数
        const render = () => {
            // 如果正在转场中，强制执行“退出动画” (移除 visible)
            if (isSwitchingGame) {
                if (container.classList.contains('visible')) {
                    container.classList.remove('visible');
                    console.log("Animation: Switching Game - Sliding Out");
                }
                return;
            }

            const shouldShow = isGameRunning && isInDisplayCycle;

            // 只有当状态真正改变时才操作 DOM，性能更好
            if (shouldShow !== lastShowState) {
                requestAnimationFrame(() => {
                    if (shouldShow) {
                        container.classList.add('visible');
                    } else {
                        container.classList.remove('visible');
                    }
                });

                lastShowState = shouldShow;

                console.log(
                    `Animation Triggered: ${shouldShow ? 'Slide In' : 'Slide Out'}`
                );
            }
        };

        const toggleCycle = () => {
            // 只有在没切游戏的时候才允许周期切换
            if (isGameRunning && !isSwitchingGame) {
                isInDisplayCycle = !isInDisplayCycle;
                render();
            }
        };

        let cycleIntervalId = setInterval(toggleCycle, CYCLE_INTERVAL);

        // 数据轮询逻辑
        const updateData = async () => {
            // 如果正在转场动画中，暂停数据更新，防止内容跳变
            if (isSwitchingGame) return;

            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    // --- 核心修改：解析 JSON ---
                    const json = await response.json();
                    const { server, info, render: newHtmlContent } = json;

                    // --- [新增] 服务器重启检测 ---
                    // 如果本地没有 ID，就记录下来；如果 ID 变了，说明服务器重启过，刷新页面
                    if (localBootId === null) {
                        localBootId = server.boot_id;
                        console.log(`Connected to Server Instance: ${localBootId}`);
                    } else if (localBootId !== server.boot_id) {
                        console.warn("Server Restart Detected! Reloading...");
                        window.location.reload();
                        return;
                    }

                    // --- 场景 1: 游戏开始 (从无到有) ---
                    if (!isGameRunning && info.is_running) {
                        console.log("Game Started.");
                        container.innerHTML = newHtmlContent;
                        currentSignature = info.signature;

                        isGameRunning = true;
                        isInDisplayCycle = true; // 强制显示

                        // 重置周期
                        clearInterval(cycleIntervalId);
                        cycleIntervalId = setInterval(toggleCycle, CYCLE_INTERVAL);

                        render();
                    }
                    // --- 场景 2: 切换游戏 (签名变了) ---
                    // 比如从 Dota2 换成 CS2，或者同一个游戏重启了
                    else if (isGameRunning && info.is_running && info.signature !== currentSignature) {
                        console.log(`Switching Game: ${currentSignature} -> ${info.signature}`);

                        // 1. 锁定状态，开始转场
                        isSwitchingGame = true;
                        render(); // 这会触发 CSS 的 Slide Out 动画

                        // 2. 等待动画结束 (2秒)
                        setTimeout(() => {
                            // 3. 替换内容
                            container.innerHTML = newHtmlContent;
                            currentSignature = info.signature;

                            // 4. 解锁并重置状态
                            isSwitchingGame = false;
                            isInDisplayCycle = true; // 新游戏开始，必须显示

                            clearInterval(cycleIntervalId);
                            cycleIntervalId = setInterval(toggleCycle, CYCLE_INTERVAL);

                            // 5. 强制触发 Slide In 动画
                            lastShowState = false; // 欺骗 render 函数认为状态变了
                            render();
                        }, ANIMATION_DURATION);
                    }
                    // --- 场景 3: 同一个游戏，只更新时间 ---
                    // 签名没变，只更新 HTML 内容
                    else if (isGameRunning && info.is_running) {
                        if (container.innerHTML !== newHtmlContent) {
                            container.innerHTML = newHtmlContent;
                        }
                    }
                    // --- 场景 4: 游戏结束 ---
                    else if (isGameRunning && !info.is_running) {
                        console.log("Game Stopped.");
                        isGameRunning = false;
                        currentSignature = "idle";
                        render(); // 触发退出动画
                    }

                } else {
                    // 接口错误也视为游戏结束
                    isGameRunning = false;
                    render();
                }
            } catch (error) {
                console.warn("Connection lost...", error);
            }
        };

        setInterval(updateData, REFRESH_INTERVAL);
        updateData();
    </script>
</body>

</html>

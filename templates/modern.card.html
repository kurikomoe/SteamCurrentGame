<style>
    /* 全局容器设置 */

    .obs-hidpi-scope {
        font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif;
        box-sizing: border-box;
        display: inline-flex;
        flex-direction: row;
        align-items: stretch;
        height: 120px;
        padding: 8px;
        margin: 0;
        line-height: normal;
    }

    /* --- 通用方块基础样式 --- */

    .hud-block {
        display: flex;
        align-items: center;
        justify-content: center;
        /* [2x] 内边距 24px -> 48px */
        padding: 0 32px;
        border-radius: 0;
        background-color: #0a0a0a;
        border: 4px solid #e0e0e0;
        margin-right: -4px;
        position: relative;
    }

    /* --- 1. 状态块 (左侧) --- */

    .block-status {
        background-color: #e0e0e0;
        color: #000000;
        font-weight: 900;
        font-size: 48px;
        text-transform: uppercase;
        min-width: 200px;
        z-index: 3;
        line-height: 1;
    }

    /* --- 2. 游戏名块 (中间) --- */

    .block-game {
        flex: 0 1 auto;
        max-width: 1800px;
        min-width: 400px;
        color: #ffffff;
        font-size: 56px;
        font-weight: bold;
        z-index: 2;
        white-space: nowrap;
        overflow: hidden;
        line-height: 1.25;
    }

    .game-text {
        overflow: hidden;
        text-overflow: ellipsis;
        padding-bottom: 8px;
        /* 微调位置, 对齐 baseline */
        margin-top: 4px;
    }

    /* --- 3. 时间块 (右侧) --- */

    .block-time {
        font-family: 'Consolas', 'Courier New', monospace;
        background-color: #1a1a1a;
        color: #cccccc;
        font-size: 48px;
        min-width: 320px;
        z-index: 1;
        border-right: 12px solid #66c0f4;
        line-height: 1;
    }

    .time-icon {
        font-size: 48px;
        margin-right: 24px;
        color: #66c0f4;
        font-weight: bold;
        vertical-align: bottom;
    }
</style>

<div class="obs-hidpi-scope">
    <div class="hud-block block-status">
        %Status%
    </div>

    <div class="hud-block block-game">
        <span class="game-text">%GameName%</span>
    </div>

    <div class="hud-block block-time">
        <span class="time-icon">TIME</span> %PlayTime%
    </div>
</div>
